<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>효과음 미리 듣기</title>
  <link rel="icon" href="data:," />
  <style>
    body { margin: 0; background: #0b0e12; color: #eef3ea; font-family: 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p.sub { color: #93a39a; margin: 0 0 18px; line-height: 1.5; }
    h2 { font-size: 20px; margin: 28px 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    button { background: #1b232b; color: #eef3ea; border: 2px solid #2f3b46; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 15px; cursor: pointer; text-align: left; min-width: 150px; }
    button:hover { border-color: #6fcf4a; }
    button small { display: block; color: #93a39a; font-size: 12px; margin-top: 3px; }
    button.big { background: #6fcf4a; color: #13200b; border-color: #6fcf4a; font-weight: bold; }
    #status { color: #93a39a; font-size: 14px; margin-left: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>효과음 미리 듣기</h1>
    <p class="sub">버튼을 누르면 게임과 똑같은 소리가 납니다. 같은 버튼을 여러 번 누르면 매번 조금씩 다르게 들립니다.</p>
    <div class="row">
      <button class="big" id="battle">전투 소리 10초 흉내</button>
      <span id="status">소리 굽는 중…</span>
    </div>
    <div id="groups"></div>
  </main>
  <script type="module" src="/src/mockup/sounds.js"></script>
</body>
</html>
