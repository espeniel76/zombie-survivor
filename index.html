<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>좀비 생존자</title>
  <meta name="theme-color" content="#11151a" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="좀비 생존자" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background: #0b0e12;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    /* 노치·카메라 구멍을 뺀 영역. Phaser는 이 상자 크기에 맞춰 가운데 놓는다
       (안쪽 여백(padding)으로 빼면 Phaser가 여백을 모르고 그만큼 아래로 밀린다) */
    #game {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
    }
    canvas { display: block; touch-action: none; }

    /* 불러오기 화면: 게임 파일이 오기 전에 바로 보인다. 깜빡임 없이 막대만 천천히 찬다. */
    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #11151a; color: #eef3ea;
      font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
      transition: opacity 0.35s ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader .bar {
      box-sizing: border-box; width: min(260px, 60vw); height: 8px; border-radius: 4px;
      background: #1b222b; border: 1px solid #2e3a47; overflow: hidden;
    }
    #loader .fill { width: 4%; height: 100%; background: #9be15d; border-radius: 3px; transition: width 0.25s linear; }
    #loader .msg { font-size: 14px; color: #93a39a; min-height: 18px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loader">
    <div class="bar"><div class="fill"></div></div>
    <div class="msg">게임 파일 받는 중…</div>
  </div>
  <script>
    // 게임 코드가 내려오는 동안 막대를 60%까지 천천히 채우고, 그다음은 게임이 window.__load로 알려 준다
    (function () {
      var el = document.getElementById('loader');
      var fill = el.querySelector('.fill');
      var msg = el.querySelector('.msg');
      var shown = 0.04, target = 0.6, done = false;
      var tick = setInterval(function () {
        shown += (target - shown) * 0.06;
        fill.style.width = (shown * 100).toFixed(1) + '%';
      }, 100);
      window.__load = {
        set: function (p, text) {
          target = Math.max(target, p);
          shown = Math.max(shown, Math.min(p, shown + 0.2));
          if (text) msg.textContent = text;
        },
        done: function () {
          if (done) return;
          done = true;
          clearInterval(tick);
          fill.style.width = '100%';
          el.classList.add('gone');
          setTimeout(function () { el.remove(); }, 400);
        },
      };
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
